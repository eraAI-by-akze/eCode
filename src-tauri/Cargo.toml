[package]
name = "ecode"
version = "0.1.0"
description = "eCode — For humans and comfort"
authors = ["eraAI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
portable-pty = "0.8"
regex = "1"
trash = "5"
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
