name: Build

# Checks on every push/PR, installers for Linux, Windows and macOS (Tauri and
# Electron) as workflow artifacts. Pushing a tag like v0.2.0 also attaches
# every installer to a draft GitHub release.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks (types, build, fmt, clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Linux deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build renderer (Electron)
        run: pnpm build
      - name: Build renderer (Tauri)
        run: pnpm build:tauri-web
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  tauri:
    name: Tauri · ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ''
            bundle: src-tauri/target/release/bundle
          - name: Windows
            os: windows-latest
            args: ''
            bundle: src-tauri/target/release/bundle
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build ${{ matrix.args }}
        env:
          # linuxdeploy (AppImage) is itself an AppImage; don't require FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: eCode-tauri-${{ runner.os }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg

  electron:
    name: Electron · ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            target: --linux AppImage deb
          - name: Windows
            os: windows-latest
            target: --win nsis
          - name: macOS
            os: macos-latest
            target: --mac dmg zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # node-pty is N-API, so building it against Node works in Electron; make
      # sure it is built even when pnpm restores it from cache.
      - run: pnpm rebuild node-pty

      - run: pnpm build

      - name: Package
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates yet: produce unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: eCode-electron-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tauri, electron]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
